name: publish

# Publishing runs on GitHub's runner, where NPM_TOKEN is injected as a secret and
# masked in logs. The value never enters the repository, this machine, or a chat.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          registry-url: 'https://registry.npmjs.org'
      # package.json runs `npm run check` from prepublishOnly, so a syntax error
      # fails the release before anything reaches the registry.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: *** secrets.NPM_TOKEN }}
